<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<title>Claudius Art Studio</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<style>

body{
margin:0;
overflow:hidden;
font-family:Arial;
}

#menu{
position:absolute;
top:20px;
left:20px;
z-index:999;
background:rgba(0,0,0,0.75);
padding:15px;
border-radius:15px;
color:white;
}

button{
display:block;
margin-top:10px;
padding:10px;
width:180px;
background:#ff7a00;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

#viewer{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.92);
z-index:9999;
}

#viewer img{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
max-width:85%;
max-height:85%;
border:4px solid white;
border-radius:10px;
}

.viewerBtn{
position:absolute;
top:50%;
transform:translateY(-50%);
font-size:50px;
background:none;
border:none;
color:white;
cursor:pointer;
padding:20px;
}

#prevBtn{
left:20px;
}

#nextBtn{
right:20px;
}

#closeBtn{
position:absolute;
top:20px;
right:20px;
font-size:25px;
background:red;
color:white;
border:none;
padding:10px 15px;
cursor:pointer;
border-radius:8px;
}

</style>

</head>

<body>

<div id="menu">

<h2>CLAUDIUS ART STUDIO</h2>

<button onclick="teleportSalle()">
Entrer : Les Abstraits
</button>

</div>

<a-scene>

<a-assets>

<img id="logo"
src="assets/claudius_art_studio_logo.png">

<img id="amadeus"
src="images/Les_abstraits/amadeus.jpg">

<img id="ange"
src="images/Les_abstraits/ange_bleu.jpg">

<img id="arbre"
src="images/Les_abstraits/arbre_des_fees.jpg">

<img id="ballade"
src="images/Les_abstraits/ballade2.jpg">

<img id="melancolie"
src="images/Les_abstraits/la_melancolie.jpg">

<img id="vivalova"
src="images/Les_abstraits/vivalova.jpg">

<img id="voxys"
src="images/Les_abstraits/voxys.jpg">

</a-assets>

<a-sky color="#111"></a-sky>

<a-light
type="ambient"
intensity="1">
</a-light>

<a-light
type="point"
position="0 8 0"
intensity="2">
</a-light>

<a-plane
rotation="-90 0 0"
width="80"
height="80"
color="#222">
</a-plane>

<a-image
src="#logo"
position="0 5 -6"
width="8"
height="3">
</a-image>

<a-box
position="0 2 -28"
width="18"
height="5"
depth="22"
color="#333">
</a-box>

<a-text
value="LES ABSTRAITS"
position="-2 5 -18"
color="#ff7a00">
</a-text>

<a-image
class="tableau"
src="#amadeus"
position="-8 3 -22"
rotation="0 90 0"
width="3"
height="3">
</a-image>

<a-image
class="tableau"
src="#ange"
position="-8 3 -28"
rotation="0 90 0"
width="3"
height="3">
</a-image>

<a-image
class="tableau"
src="#arbre"
position="-8 3 -34"
rotation="0 90 0"
width="3"
height="3">
</a-image>

<a-image
class="tableau"
src="#ballade"
position="8 3 -22"
rotation="0 -90 0"
width="3"
height="3">
</a-image>

<a-image
class="tableau"
src="#melancolie"
position="8 3 -28"
rotation="0 -90 0"
width="3"
height="3">
</a-image>

<a-image
class="tableau"
src="#vivalova"
position="8 3 -34"
rotation="0 -90 0"
width="3"
height="3">
</a-image>

<a-image
class="tableau"
src="#voxys"
position="0 3 -38"
width="5"
height="3">
</a-image>

<a-entity
id="cameraRig"
position="0 1.6 6">

<a-camera
look-controls
wasd-controls>
</a-camera>

</a-entity>

</a-scene>

<!-- Visionneuse -->

<div id="viewer">

<img id="viewerImg">

<button
id="prevBtn"
class="viewerBtn">
❮
</button>

<button
id="nextBtn"
class="viewerBtn">
❯
</button>

<button
id="closeBtn">
X
</button>

</div>

<script>

function teleportSalle(){

document
.getElementById("cameraRig")
.setAttribute(
"position",
"0 1.6 -15"
);

}

const images = [

"images/Les_abstraits/amadeus.jpg",

"images/Les_abstraits/ange_bleu.jpg",

"images/Les_abstraits/arbre_des_fees.jpg",

"images/Les_abstraits/ballade2.jpg",

"images/Les_abstraits/la_melancolie.jpg",

"images/Les_abstraits/vivalova.jpg",

"images/Les_abstraits/voxys.jpg"

];

let current = 0;

const viewer =
document.getElementById("viewer");

const viewerImg =
document.getElementById("viewerImg");

function openViewer(index){

current = index;

viewer.style.display = "block";

viewerImg.src = images[current];

}

function closeViewer(){

viewer.style.display = "none";

}

document
.getElementById("closeBtn")
.addEventListener(
"click",
closeViewer
);

document
.getElementById("nextBtn")
.addEventListener(
"click",
function(){

current++;

if(current >= images.length){

current = 0;

}

viewerImg.src = images[current];

}
);

document
.getElementById("prevBtn")
.addEventListener(
"click",
function(){

current--;

if(current < 0){

current = images.length - 1;

}

viewerImg.src = images[current];

}
);

const tableaux =
document.querySelectorAll(".tableau");

tableaux.forEach(
function(tableau,index){

tableau.addEventListener(
"click",
function(){

openViewer(index);

}
);

}
);

document.addEventListener(
"keydown",
function(e){

if(viewer.style.display==="block"){

if(e.key==="ArrowRight"){

document
.getElementById("nextBtn")
.click();

}

if(e.key==="ArrowLeft"){

document
.getElementById("prevBtn")
.click();

}

if(e.key==="Escape"){

closeViewer();

}

}

}
);

</script>

</body>

</html>
